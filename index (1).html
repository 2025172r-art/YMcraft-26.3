<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YMcraft 26.3</title>
<style>html,body{margin:0;height:100%;background:#EF323D;color:#fff;font:15px sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column}
#b{width:min(70vw,420px);height:14px;border:2px solid #fff;padding:2px;box-sizing:border-box;margin-top:16px}#f{height:100%;width:0;background:#fff}</style></head>
<body><div id="t">YMCRAFT を読み込み中...</div><div id="b"><div id="f"></div></div>
<script>
(async function(){
var N=4,parts=[],tot=0,got=[0,0,0,0];
function bar(){var s=got.reduce(function(a,b){return a+b},0);document.getElementById("f").style.width=Math.min(100,s/87e6*100*0.9)+"%"}
try{
 for(var i=0;i<N;i++){
  var r=await fetch("index.html.part"+i+".bin",{cache:"force-cache"});if(!r.ok)throw new Error("part"+i+" "+r.status);
  var rd=r.body.getReader(),ch=[];
  for(;;){var x=await rd.read();if(x.done)break;ch.push(x.value);got[i]+=x.value.length;bar()}
  parts.push(new Blob(ch));
 }
 document.getElementById("t").textContent="起動中...";
 var u=URL.createObjectURL(new Blob(parts,{type:"text/html;charset=utf-8"}));
 location.replace(u);
}catch(e){document.getElementById("t").textContent="読み込みに失敗しました: "+e.message}
})();
</script></body></html>
